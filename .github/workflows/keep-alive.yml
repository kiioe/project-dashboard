name: Keep database awake

# Supabase's free plan pauses a project after 7 days without activity.
# This calls the keep_alive() database function every 3 days so that never happens.
# Remove this workflow once the project is on Supabase Pro (Pro projects never pause).
# What could stop it, and what to update, is listed in CLAUDE.md under "Keep-alive watch list".

on:
  schedule:
    - cron: '17 6 */3 * *' # about 06:17 UTC on every third day of the month
  workflow_dispatch: # adds a "Run workflow" button for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # Only the apikey header: it works for both the legacy anon key and the newer
          # sb_publishable_ keys (sending a publishable key as a Bearer token is rejected).
          for attempt in 1 2 3; do
            response=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST \
              "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{}') || response=$'\n000'
            status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            echo "Attempt $attempt: HTTP $status $body"
            case "$status" in
              200)
                if [ "$body" = '"ok"' ]; then echo "Database is awake."; exit 0; fi ;;
              401|403)
                echo "::error::Supabase rejected the key. Update the SUPABASE_ANON_KEY secret with the project's anon or publishable key (it may have been rotated)."
                exit 1 ;;
              404)
                echo "::error::keep_alive() was not found. Run supabase/keep-alive.sql in this Supabase project, or check SUPABASE_URL points at the right project."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No answer from Supabase. The project may be paused (restore it in the Supabase dashboard), or SUPABASE_URL may be wrong."
          exit 1
